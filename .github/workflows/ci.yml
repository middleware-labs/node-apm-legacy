name: CI

on:
  push:
    branches: [master, main, minimal-version, node16-test]
  pull_request:

jobs:
  # The reason this package exists: it has to keep working on the Node
  # versions the main node-apm package no longer supports.
  smoke:
    # 22.04 still ships the glibc that Node 14/16 binaries were built against.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ['14', '16', '18']
    name: traces + logs on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      # Build with a modern Node -- TypeScript 5 does not run on Node 14 --
      # then run the smoke test on the version under test against `lib/`.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm run smoke
